 <div class="calculator">

 <div class="display">
    Victor: <input type="number" id="inputField1" placeholder="30">

    <button onclick="calculatesum()">Sum</button>
     </div>

    <div class="div" id="output">
   <label for="output">Total:</label>

    </div>


    

 </div>
    


<script>




    function calculatesum () {

let Victor  =  Number (document.getElementById('inputField1').value)
let Emma = Number (document.getElementById('inputField2').value)
let Chris = Number (document.getElementById('inputField3').value)

let sum =Chris + Emma + Victor;
document.getElementById('total').value = sum;

}
